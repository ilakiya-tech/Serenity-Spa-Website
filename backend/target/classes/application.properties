# Server Configuration
server.port=8080

# Application Profiles (default uses h2; dev/prod with MySQL can use mysql profile)
spring.profiles.active=h2

# Application Properties
app.jwt.secret=${JWT_SECRET:SerenitySpaSuperSecretKeyThatMustBeAtLeast256BitsLongForHMACSHA256Security123456}
app.jwt.expiration-ms=86400000

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
